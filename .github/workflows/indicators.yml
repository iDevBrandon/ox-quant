# .github/workflows/indicators.yml
name: Indicators (Supabase sync)

on:
  schedule:
    # Once per weekday. GitHub's scheduled runs are frequently delayed by
    # several hours under load, so we deliberately do NOT gate on a specific
    # clock hour. The previous "run only when it is 10:00 AM in New York" gate
    # made every delayed run fail the hour check and skip the sync entirely,
    # which froze the indicators table. A single daily snapshot is all the
    # Fear & Greed / VIX / DXY / RSI cards need and the exact time of day does
    # not matter, so we just run once and let GitHub schedule it whenever.
    - cron: "0 14 * * 1-5" # nominal 14:00 UTC weekdays (runs later in practice)
  workflow_dispatch: # Manual execution

jobs:
  run-indicators-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-indicators-${{ hashFiles('indices/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-indicators-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r indices/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('indices/requirements.txt') }}

      - name: Install Playwright browser
        run: |
          # The hosted runner image ships a Google Chrome apt source that
          # intermittently serves a Packages index whose hash does not match
          # its Release file. `--with-deps` runs `apt-get update`, so that
          # mismatch fails the whole job. Drop the third-party source first,
          # and fall back to a browser-only install if apt still misbehaves —
          # the ubuntu-latest image already carries Chromium's shared libs.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq || true
          playwright install --with-deps chromium || playwright install chromium

      - name: Fetch All Indicators
        env:
          FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
          FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
        run: |
          cd indices
          python fetch_all_indicators.py --output ../fetch_indicators_summary.json

      - name: Insert Indicators to Database
        env:
          FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
          FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
        run: |
          cd indices
          python insert_indicators.py --input ../fetch_indicators_summary.json

      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicators-sync-summary
          path: fetch_indicators_summary.json
          retention-days: 7

      - name: Check for failures
        if: failure()
        run: echo "Indicators sync failed - check logs and artifacts"

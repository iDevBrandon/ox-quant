name: Screener (Oxinion Global 500)

on:
  schedule:
    # Runs at 10:45 AM New York time (EDT, UTC-4)
    - cron: "45 14 * * 1-5"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch-signals:
    name: Run screener for Global 500
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
      FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
      # US tickers -> Alpaca (licensed). Absent -> everything falls back to yfinance.
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: toolkit/screener/requirements.txt

      - name: Install dependencies
        run: pip install -r toolkit/screener/requirements.txt

      - name: Run stock evaluator (IOO)
        working-directory: toolkit/screener
        run: python main.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::screener failed — check logs above"

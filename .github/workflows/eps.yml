name: EPS History (SEC EDGAR)

# Deep Basic EPS (annual + quarterly) from the SEC XBRL companyconcept API.
# Free, no key, no daily cap. US filers only — non-US tickers are skipped with
# no network call. Universe is split into 4 disjoint stride shards run in
# parallel (each on its own runner IP). Resume-skip continues across runs.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"         # daily 06:00 UTC

jobs:
  eps:
    name: EPS shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    env:
      FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
      FINANCE_SUPABASE_SECRET_KEY:   ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
      EPS_SHARD:            ${{ matrix.shard }}
      EPS_SHARDS:           "4"
      EPS_LIMIT:            "3000"
      EPS_SLEEP:            "0.5"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: eps/requirements.txt

      - name: Install dependencies
        run: pip install -r eps/requirements.txt

      - name: Run EPS crawler shard
        run: python eps/main.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::EPS shard ${{ matrix.shard }} failed — check logs above"

# .github/workflows/sync-indicators.yml
name: Sync Indicators to Supabase

on:
  schedule:
    # GitHub cron is UTC-only and has no DST. Fire at BOTH candidate times and
    # let the "gate" job below allow only the one that is 10:00 AM in New York:
    #   14:00 UTC = 10:00 New York during EDT (summer)
    #   15:00 UTC = 10:00 New York during EST (winter)
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch: # Manual execution

jobs:
  # Allow the run only when it is 10:00 in America/New_York (handles DST),
  # or always for manual runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "New York hour: $HOUR (event: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "10" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Not 10:00 AM New York — skipping sync."
          fi

  run-indicators-sync:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-indicators-${{ hashFiles('indices/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-indicators-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r indices/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('indices/requirements.txt') }}

      - name: Install Playwright browser
        run: |
          # The hosted runner image ships a Google Chrome apt source that
          # intermittently serves a Packages index whose hash does not match
          # its Release file. `--with-deps` runs `apt-get update`, so that
          # mismatch fails the whole job. Drop the third-party source first,
          # and fall back to a browser-only install if apt still misbehaves —
          # the ubuntu-latest image already carries Chromium's shared libs.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq || true
          playwright install --with-deps chromium || playwright install chromium

      - name: Fetch All Indicators
        env:
          FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
          FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
        run: |
          cd indices
          python fetch_all_indicators.py --output ../fetch_indicators_summary.json

      - name: Insert Indicators to Database
        env:
          FINANCE_SUPABASE_URL: ${{ secrets.FINANCE_SUPABASE_URL }}
          FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
        run: |
          cd indices
          python insert_indicators.py --input ../fetch_indicators_summary.json

      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicators-sync-summary
          path: fetch_indicators_summary.json
          retention-days: 7

      - name: Check for failures
        if: failure()
        run: echo "Indicators sync failed - check logs and artifacts"

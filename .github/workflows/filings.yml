name: Filings (SEC EDGAR XBRL)

# Latest 10-Q core financials (revenue, net income, assets, …) from the SEC
# XBRL APIs into filings + filing_facts. Free, no key, no daily cap. US filers
# only — non-US tickers are skipped with no network call. Universe split into 4
# disjoint stride shards run in parallel. Idempotent (dedupe on accession_no),
# so daily re-runs simply pick up newly-filed quarters.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"          # daily 07:00 UTC (offset from eps 06:00)

jobs:
  filings:
    name: Filings shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    env:
      FINANCE_SUPABASE_URL:        ${{ secrets.FINANCE_SUPABASE_URL }}
      FINANCE_SUPABASE_SECRET_KEY: ${{ secrets.FINANCE_SUPABASE_SECRET_KEY }}
      FIL_SHARD:  ${{ matrix.shard }}
      FIL_SHARDS: "4"
      FIL_LIMIT:  "500"
      FIL_SLEEP:  "0.4"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: filings/requirements.txt

      - name: Install dependencies
        run: pip install -r filings/requirements.txt

      - name: Run filings crawler shard
        run: python filings/main.py

      - name: Notify on failure
        if: failure()
        run: echo "::error::Filings shard ${{ matrix.shard }} failed — check logs above"
